<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020a1e">
<title>사이언스 뿌요 팡! · 소리의 성질</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/s_title.webp">
<link rel="stylesheet" href="neon.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <!-- 첫 화면 -->
  <section class="scr on" id="sTitle" data-bg="s_title">
    <button class="hot" id="tHow" style="left:118px;top:698px;width:358px;height:114px" aria-label="게임 방법"></button>
    <button class="hot" id="tStart" style="left:498px;top:676px;width:676px;height:150px" aria-label="게임 시작"></button>
    <button class="hot" id="tTeacher" style="left:1196px;top:698px;width:362px;height:114px" aria-label="교사 관리"></button>
  </section>

  <!-- 입장 -->
  <section class="scr" id="sEntry" data-bg="s_entry">
    <input class="fld" id="inCode" style="left:622px;top:388px;width:802px;height:76px" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" autocomplete="off">
    <input class="fld" id="inName" style="left:622px;top:508px;width:802px;height:78px" maxlength="12" placeholder="예) 도레미" autocomplete="off">
    <div class="tx m" id="entryErr" style="left:170px;top:648px;width:1332px;height:38px;font-size:24px"></div>
    <button class="hot" id="eBack" style="left:280px;top:696px;width:320px;height:116px" aria-label="뒤로"></button>
    <button class="hot" id="eJoin" style="left:646px;top:684px;width:734px;height:132px" aria-label="입장하기"></button>
  </section>

  <!-- 게임 방법 -->
  <section class="scr" id="sHow" data-bg="s_tutorial">
    <div id="how1">
      <button class="hot" id="hBack" style="left:80px;top:818px;width:283px;height:94px" aria-label="뒤로"></button>
      <button class="hot" id="hNext" style="left:1310px;top:818px;width:290px;height:94px" aria-label="확인"></button>
    </div>
    <div id="how2" class="how2">
      <div class="h2title"><span>🔥 문제 풀며 터지는 이벤트</span></div>
      <div class="evgrid" id="evGrid"></div>
      <p class="h2note">문제를 푸는 동안 뿌요는 멈춰요 · 틀린 문제는 조금 뒤에 다시 나와요 · 사진을 누르면 크게 보여요</p>
      <button class="pill c" id="h2Back" style="left:80px;top:830px;width:270px;height:86px">이전</button>
      <button class="pill m" id="h2Ok" style="left:1320px;top:830px;width:270px;height:86px">확인</button>
    </div>
  </section>

  <!-- 대기실 -->
  <section class="scr" id="sLobby" data-bg="s_lobby_1v1">
    <div class="tx y lbTag" id="lbTag"></div>
    <div id="lbSlots"></div>
    <div class="tx l" id="lbUnits" style="left:500px;top:470px;width:290px;height:60px;font-size:28px"></div>
    <div class="tx l" id="lbTime" style="left:985px;top:470px;width:290px;height:60px;font-size:28px"></div>
    <div class="cover" id="lbMsgCover" style="left:300px;top:594px;width:1074px;height:70px;background:#011c32;display:none"></div>
    <div class="tx c" id="lbMsg" style="left:300px;top:594px;width:1074px;height:70px;font-size:44px;display:none"></div>
    <div class="lvPanel" id="lbLevel" style="left:1006px;top:270px;width:548px;height:178px;display:none"></div>
    <button class="hot" id="lbHow" style="left:74px;top:738px;width:392px;height:106px" aria-label="게임 방법"></button>
    <button class="hot" id="lbRank" style="left:1208px;top:738px;width:402px;height:106px" aria-label="우리 반 랭킹"></button>
    <button class="sndBtn" id="sndLobby" style="left:1588px;top:22px">🔊</button>
  </section>

  <!-- 대결 -->
  <section class="scr" id="sGame" data-bg="s_match_1v1">
    <div class="tagCover on" id="gTag" style="left:510px;top:118px;width:170px;height:42px"></div>
    <img class="gLbl" id="gLbl" src="img/lb_2p.webp" alt="2인전">
    <img class="dIcon" id="gDIcon" src="img/lb_dicon_i.webp" alt="">
    <div class="tx" id="gTimer" style="left:706px;top:110px;width:262px;height:62px;font-size:46px;font-family:var(--fe);font-weight:700"></div>
    <div class="evChip" id="gEv"></div>
        <button class="sndBtn" id="sndGame" style="left:1588px;top:22px">🔊</button>

    <!-- 내 판 -->
    <img class="at ava" id="myAva" style="left:98px;top:186px;width:46px;height:44px" alt="">
    <div class="tx l" id="myName" style="left:150px;top:184px;width:200px;height:50px;font-size:28px"></div>
    <div class="tx r y" id="myScore" style="left:300px;top:184px;width:166px;height:50px;font-size:26px;font-family:var(--fe);font-weight:700"></div>
    <div class="at" id="myBoardBox" style="left:102px;top:250px;width:216px;height:504px">
      <canvas id="myBoard"></canvas>
      <div class="chainPop" id="chainPop"></div>
    </div>
    <div class="hud" style="left:338px;top:250px;background-image:url(img/h_next.webp)"><canvas id="nextCv"></canvas></div>
    <div class="hud" style="left:338px;top:378px;background-image:url(img/h_star.webp)"><div class="hv" id="myStars">0</div></div>
    <div class="hud" style="left:338px;top:506px;background-image:url(img/h_streak.webp)"><div class="hv" id="myStreak">0</div><div class="hs" id="myStreakNext"></div></div>
    <div class="hud" style="left:338px;top:634px;background-image:url(img/h_garb.webp)"><div class="hv" id="myGarb">0</div><div class="hs" id="myGarbIcons"></div></div>

    <!-- 과학 미션 -->
    <img class="at" id="goldIcon" src="img/i_golden.webp" style="left:1092px;top:200px;width:84px;height:84px;display:none" alt="">
    <div class="at mission" id="mission" style="left:528px;top:266px;width:618px;height:150px"></div>
    <div id="choices"></div>
    <div class="npanel" id="pane" style="left:508px;top:442px;width:656px;height:198px;display:none"></div>
    <div class="at" id="qPanel" style="left:498px;top:262px;width:676px;height:520px"></div>

    <!-- 조작 -->
    <div id="controls">
      <button class="hot ctl" data-k="left" style="left:502px;top:651px;width:117px;height:117px" aria-label="왼쪽"></button>
      <button class="ib ctl" data-k="rotL" style="left:621px;top:646px;width:134px;height:124px;background-image:url(img/c_rotL.webp)" aria-label="왼쪽 회전"></button>
      <button class="hot ctl" data-k="drop" style="left:757px;top:645px;width:158px;height:128px" aria-label="놓기"></button>
      <button class="ib ctl" data-k="rotR" style="left:917px;top:646px;width:134px;height:124px;background-image:url(img/c_rotR.webp)" aria-label="오른쪽 회전"></button>
      <button class="hot ctl" data-k="right" style="left:1054px;top:651px;width:117px;height:117px" aria-label="오른쪽"></button>
    </div>

    <!-- 3학년 쉬운 조작: 버튼 4개 (옮기기·돌리기·놓기) -->
    <div id="easyCtl">
      <button class="ez" data-k="left"><b>◀</b><span>왼쪽</span></button>
      <button class="ez rot" data-k="rotR"><b>↻</b><span>돌리기</span></button>
      <button class="ez drop" data-k="drop"><b>⬇</b><span>놓기</span></button>
      <button class="ez" data-k="right"><b>▶</b><span>오른쪽</span></button>
    </div>

    <!-- 상대 -->
    <div id="opps"></div>
    <img class="at shot" id="shot" src="img/e_shot.webp" alt="">
  </section>

  <!-- 결과 -->
  <section class="scr" id="sResult" data-bg="s_result">
    <div class="loseCover" id="rLoseCover"></div>
    <img class="at" id="rBadge" alt="" style="display:none">
    <div class="tx" id="rName" style="left:150px;top:402px;width:416px;height:82px;font-size:38px"></div>
    <div id="rRows"></div>
    <div class="tx y" id="rAcc" style="left:660px;top:266px;width:280px;height:82px;font-size:56px;font-family:var(--fe);font-weight:700"></div>
    <div class="tx y" id="rChain" style="left:975px;top:266px;width:280px;height:82px;font-size:56px;font-family:var(--fe);font-weight:700"></div>
    <div class="tx y" id="rPoints" style="left:1290px;top:266px;width:290px;height:82px;font-size:56px;font-family:var(--fe);font-weight:700"></div>
    <div class="at review" id="rToday" style="left:672px;top:450px;width:896px;height:172px"></div>
    <div class="cover" id="rBarCover" style="left:700px;top:694px;width:404px;height:46px;background:#00162d;display:none"></div>
    <div class="tx c" id="rBar" style="left:700px;top:694px;width:404px;height:46px;font-size:26px;display:none"></div>
    <div class="tx y" id="rSec" style="left:640px;top:756px;width:530px;height:34px;font-size:24px;display:none"></div>
    <button class="hot" id="rWrong" style="left:1191px;top:680px;width:196px;height:72px" aria-label="오답 복습"></button>
    <button class="hot" id="rRank" style="left:1394px;top:680px;width:202px;height:72px" aria-label="우리 반 랭킹"></button>
    <div class="lvRow" id="rLevel" style="left:500px;top:806px;width:1080px;height:90px;display:none"></div>
    <button class="pill m" id="rLobby" style="left:120px;top:806px;width:330px;height:86px;display:none">대기실로</button>
  </section>

  <!-- 오답 복습 -->
  <section class="scr" id="sReview" data-bg="s_review">
    <div class="tx" id="rvIdx" style="left:190px;top:52px;width:228px;height:52px;font-size:32px;font-family:var(--fe);font-weight:700"></div>
    <div class="tx y" id="rvUnit" style="left:1342px;top:58px;width:146px;height:44px;font-size:24px"></div>
    <div class="at review" id="rvQ" style="left:170px;top:166px;width:1340px;height:186px"></div>
    <div id="rvChoices"></div>
    <div class="at rvExp" id="rvExp" style="left:150px;top:662px;width:1380px;height:112px"></div>
    <button class="hot" id="rvPrev" style="left:108px;top:816px;width:326px;height:96px" aria-label="이전 문제"></button>
    <button class="hot" id="rvClose" style="left:693px;top:816px;width:282px;height:96px" aria-label="닫기"></button>
    <button class="hot" id="rvNext" style="left:1238px;top:816px;width:336px;height:96px" aria-label="다음 문제"></button>
  </section>

  <!-- 랭킹 -->
  <section class="scr" id="sRank" data-bg="s_ranking">
    <div id="rkTabs"></div>
    <select class="rkBy" id="rkBy" aria-label="보고 싶은 랭킹" style="left:1376px;top:140px;width:186px;height:64px"></select>
    <div id="rkHead"></div>
    <div id="rkRows"></div>
    <div class="tx l" id="rkMine" style="left:372px;top:740px;width:1000px;height:54px;font-size:28px"></div>
    <div id="rkPager" class="pager" style="left:1380px;top:742px"></div>
    <button class="hot" id="rkBack" style="left:86px;top:826px;width:224px;height:84px" aria-label="뒤로"></button>
    <button class="hot" id="rkClose" style="left:1364px;top:826px;width:222px;height:84px" aria-label="닫기"></button>
  </section>

  <!-- 랭킹전 도전 -->
  <section class="scr" id="sChal" data-bg="s_rank_board">
    <div class="tx l" id="chTime" style="left:556px;top:146px;width:880px;height:54px;font-size:28px"></div>
    <div id="chRows"></div>
    <div class="tx l" id="chMine" style="left:330px;top:738px;width:450px;height:56px;font-size:26px"></div>
    <div class="tx l" id="chState" style="left:1056px;top:738px;width:490px;height:56px;font-size:24px"></div>
    <div id="chPager" class="chPager"></div>
    <button class="chGo" id="chGo" style="left:990px;top:828px;width:350px;height:78px" disabled>⚔ 도전 시작!</button>
    <button class="hot" id="chClose" style="left:1368px;top:830px;width:214px;height:74px" aria-label="닫기"></button>
  </section>

  <!-- 랭킹전 VS -->
  <section class="scr" id="sRankVS" data-bg="s_rank_vs">
    <div class="tx y" id="vsCPos" style="left:368px;top:350px;width:228px;height:58px;font-size:38px;font-family:var(--fe);font-weight:700"></div>
    <div class="vsName" id="vsCName" style="left:150px;top:462px;width:520px;height:132px"></div>
    <div class="tx y" id="vsDPos" style="left:1222px;top:350px;width:228px;height:58px;font-size:38px;font-family:var(--fe);font-weight:700"></div>
    <div class="vsName" id="vsDName" style="left:1010px;top:462px;width:520px;height:132px"></div>
    <div class="tx" id="vsTime" style="left:790px;top:576px;width:176px;height:56px;font-size:26px"></div>
  </section>

  <!-- 겹쳐 뜨는 것들 -->
  <div class="ov dim" id="ovCount"><img id="cdImg" class="cdImg" alt=""></div>
  <div class="ov dim" id="ovStatus"><div class="card" id="stCard"><img id="stImg" alt=""><button class="stBtn" id="stBtn"></button></div></div>
  <div class="ov dim" id="ovChal"><div class="chalPop"><img src="img/rp_challenged.webp" alt=""><div class="cpName" id="cpName"></div><button class="cpBtn" id="cpBtn">확인</button></div></div>
  <div class="ov dim" id="ovZoom"><img id="zoomImg" alt=""><div class="zoomTip">아무 곳이나 누르면 닫혀요</div></div>
  <div class="banner" id="banner"></div>
  <img class="fbImg" id="fbImg" alt="">
  <div class="feed" id="feed"></div>
  <div class="toast" id="toast"></div>
</div>
<div id="rotate"><img src="img/logo.webp" alt=""><div>태블릿이나 휴대폰을 <b>가로로</b> 돌려 주세요</div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="stage.js"></script>
<script src="engine.js"></script>
<script src="jelly.js"></script>
<script src="student.js"></script>
</body>
</html>
